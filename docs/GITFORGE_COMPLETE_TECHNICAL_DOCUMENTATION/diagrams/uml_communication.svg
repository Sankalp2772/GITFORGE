<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="umllbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="uArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#umllbg)" rx="12"/>
  <text x="600" y="45" fill="#f0f6fc" font-size="24" font-family="Segoe UI, sans-serif" font-weight="bold" text-anchor="middle">GitForge UML Component &amp; Communication Architecture</text>
  <text x="600" y="72" fill="#8b949e" font-size="14" font-family="Segoe UI, sans-serif" text-anchor="middle">High-Level Interaction Between Clients, API Gateway, Services, Storage &amp; Toolchain</text>

  <!-- Client Layer Box -->
  <g transform="translate(60, 110)">
    <rect width="300" height="520" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
    <rect width="300" height="35" rx="8" fill="#1f6feb"/>
    <text x="150" y="23" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">&lt;&lt;Client Layer&gt;&gt;</text>
    
    <rect x="25" y="60" width="250" height="80" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="150" y="95" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">React SPA (Vite)</text>
    <text x="150" y="118" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">Dashboard, Monaco, Graph, Run UI</text>

    <rect x="25" y="170" width="250" height="80" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="150" y="205" fill="#3fb950" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Native Git CLI</text>
    <text x="150" y="228" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">git push, git pull, git clone</text>

    <rect x="25" y="280" width="250" height="80" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="150" y="315" fill="#bc8cff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Interactive Stdin</text>
    <text x="150" y="338" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">HTTP POST /run-sessions/:id/input</text>
  </g>

  <!-- Server Core Box -->
  <g transform="translate(450, 110)">
    <rect width="320" height="520" rx="8" fill="#161b22" stroke="#8957e5" stroke-width="2"/>
    <rect width="320" height="35" rx="8" fill="#8957e5"/>
    <text x="160" y="23" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">&lt;&lt;GitForge Core Server&gt;&gt;</text>

    <rect x="25" y="55" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="80" fill="#d2a8ff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Express Router &amp; Auth JWT</text>
    <text x="160" y="100" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">Token Verification &amp; Route Dispatch</text>

    <rect x="25" y="130" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="155" fill="#7ee787" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">gitHttp.ts Handler</text>
    <text x="160" y="175" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">git-upload-pack / git-receive-pack</text>

    <rect x="25" y="205" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="230" fill="#79c0ff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">BuildEngineController</text>
    <text x="160" y="250" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">Coordinates Pipeline &amp; Workspace</text>

    <rect x="25" y="280" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="305" fill="#f0883e" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">ParallelBuildScheduler</text>
    <text x="160" y="325" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">Concurrency Semaphore &amp; Worker Loop</text>

    <rect x="25" y="355" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="380" fill="#ff7b72" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">LocalRunManager</text>
    <text x="160" y="400" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">Child Process Stdio Pipe Manager</text>

    <rect x="25" y="430" width="270" height="60" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="160" y="455" fill="#e3b341" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Prisma ORM Client</text>
    <text x="160" y="475" fill="#8b949e" font-size="10" text-anchor="middle" font-family="Segoe UI">Relational Persistence Layer</text>
  </g>

  <!-- Storage and External Services -->
  <g transform="translate(860, 110)">
    <rect width="280" height="520" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <rect width="280" height="35" rx="8" fill="#238636"/>
    <text x="140" y="23" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" font-family="Segoe UI">&lt;&lt;Storage &amp; Toolchain&gt;&gt;</text>

    <rect x="20" y="60" width="240" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="140" y="90" fill="#7ee787" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">MySQL Database</text>
    <text x="140" y="115" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">Users, Repos, PRs, Issues</text>

    <rect x="20" y="150" width="240" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="140" y="180" fill="#79c0ff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Bare Git Repositories</text>
    <text x="140" y="205" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">D:/gitforge/data/repos</text>

    <rect x="20" y="240" width="240" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="140" y="270" fill="#d2a8ff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Build Cache (CAS)</text>
    <text x="140" y="295" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">D:/gitforge/data/build-cache</text>

    <rect x="20" y="330" width="240" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="140" y="360" fill="#f0883e" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">Build Workspaces</text>
    <text x="140" y="385" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">D:/gitforge/data/build-workspaces</text>

    <rect x="20" y="420" width="240" height="75" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="140" y="450" fill="#ff7b72" font-size="13" font-weight="bold" text-anchor="middle" font-family="Segoe UI">MinGW GCC / CMake</text>
    <text x="140" y="475" fill="#8b949e" font-size="11" text-anchor="middle" font-family="Segoe UI">C:/msys64/ucrt64/bin</text>
  </g>

  <!-- Connectors -->
  <path d="M 360 170 L 450 170" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
  <path d="M 360 220 L 450 250" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
  <path d="M 770 170 L 860 170" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
  <path d="M 770 250 L 860 270" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
  <path d="M 770 330 L 860 370" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
  <path d="M 770 470 L 860 100" stroke="#58a6ff" stroke-width="2" marker-end="url(#uArr)"/>
</svg>